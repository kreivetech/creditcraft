[package]
name = "creditcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Kreive Tech <contact@kreive.com.br>"]
description = "Deterministic integer-based credit calculation and token billing engine for metered APIs and AI workflows"
license = "MIT"
readme = "README.md"
repository = "https://github.com/kreivetech/creditcraft"
homepage = "https://kreive.com.br"
documentation = "https://docs.rs/creditcraft"
keywords = ["billing", "credits", "metered-api", "tokens", "pricing"]
categories = ["finance", "data-structures", "algorithms"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
